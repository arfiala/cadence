<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t">
  <title id="t">Doorway pec stretch: forearm on the frame, step gently through</title>
  <!-- door frame -->
  <line x1="216" y1="28" x2="216" y2="192" stroke="#9FB0A8" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke="#0B3D2E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso leaning slightly forward -->
    <line x1="150" y1="70" x2="146" y2="128"/>
    <!-- stretched arm: elbow at shoulder height, forearm up the frame -->
    <polyline points="150,84 192,82 212,52"/>
    <!-- other arm relaxed -->
    <polyline points="150,84 128,120"/>
    <!-- front leg stepping through -->
    <polyline points="146,128 176,158 182,188"/>
    <!-- back leg long -->
    <polyline points="146,128 116,162 106,188"/>
  </g>
  <circle cx="150" cy="56" r="13" fill="#0B3D2E"/>
  <!-- highlight: chest and front shoulder -->
  <g fill="none" stroke="#2BB673" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="154" y1="84" x2="188" y2="82"/>
  </g>
  <line x1="20" y1="192" x2="300" y2="192" stroke="#9FB0A8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
