<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="t">
  <title id="t">Dead hang: hold a bar with straight arms and let the shoulders rise</title>
  <!-- bar and uprights -->
  <line x1="70" y1="30" x2="250" y2="30" stroke="#9FB0A8" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="30" x2="80" y2="192" stroke="#9FB0A8" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="30" x2="240" y2="192" stroke="#9FB0A8" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#0B3D2E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- arms straight up to the bar -->
    <line x1="146" y1="34" x2="152" y2="86"/>
    <line x1="174" y1="34" x2="168" y2="86"/>
    <!-- torso -->
    <line x1="160" y1="86" x2="160" y2="140"/>
    <!-- relaxed legs -->
    <polyline points="160,140 152,172 154,188"/>
    <polyline points="160,140 168,170 166,188"/>
  </g>
  <circle cx="160" cy="72" r="13" fill="#0B3D2E"/>
  <!-- highlight: lats and shoulders under stretch -->
  <g fill="none" stroke="#2BB673" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="52" x2="158" y2="96"/>
    <line x1="170" y1="52" x2="162" y2="96"/>
  </g>
  <line x1="20" y1="192" x2="300" y2="192" stroke="#9FB0A8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
